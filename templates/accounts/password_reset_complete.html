{% extends 'base.html' %}
{% block title %}Password Reset Complete – AgriMarket{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 2rem;">
    <div style="width: 100%; max-width: 460px;">

        <div style="background:#fff; border:1.5px solid #f0f0f0; border-radius:20px; padding:2.5rem; box-shadow:0 4px 24px rgba(0,0,0,0.08); text-align:center;">

            <div style="width:72px;height:72px;border-radius:50%;background:rgba(0,208,132,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:2rem;color:#00D084;">
                <i class="bi bi-check-circle-fill"></i>
            </div>

            <h4 style="color:#1a1a1a;font-weight:800;margin-bottom:0.5rem;">Password Reset!</h4>
            <p style="color:#666;font-size:0.9rem;line-height:1.6;margin-bottom:2rem;">
                Your password has been successfully updated.<br>
                You can now log in with your new password.
            </p>

            <a href="{% url 'accounts:login' %}" class="btn btn-success w-100 fw-bold py-2" style="border-radius:50px;font-size:0.95rem;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Go to Login
            </a>
        </div>

    </div>
</div>
{% endblock %}
